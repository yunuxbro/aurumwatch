name: Daily market refresh

on:
  schedule:
    # 12:00 Asia/Colombo (UTC+05:30)
    - cron: "30 6 * * 1-5"
  push:
    paths:
      - "data/pettah_quotes.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Refresh feeds and exports
        run: python src/run_daily.py
      - name: Commit updated dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh daily market data"
            git push
          fi
